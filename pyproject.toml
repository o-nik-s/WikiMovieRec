[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "wikimovierec"
version = "1.0.0"
description = "Movie recommender from Wikipedia outgoing links"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.4",
    "scikit-learn>=1.0",
    "scipy>=1.7",
    "tqdm>=4.64",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "unidecode>=1.3",
]

[project.optional-dependencies]
tf = ["tensorflow>=2.10"]
dev = ["pytest"]

[project.scripts]
wikimovierec = "src.main:main"